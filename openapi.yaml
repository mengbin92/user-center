tags:
    - name: AdminUserService
      description: AdminUserService is the administrator account lifecycle surface.
    - name: AuditService
      description: AuditService exposes the immutable authorization and security audit trail.
    - name: AuthService
      description: |-
        AuthService owns public, unauthenticated authentication entry points.
         Browser sessions are established with HttpOnly cookies; no bearer token is
         ever returned to a browser caller.
    - name: IAMService
      description: |-
        IAMService is the platform authorization governance surface. Every write
         carries the expected policy revision and a reason; preview responses are
         descriptive and never grant authority.
    - name: IntegrationAdminService
      description: |-
        IntegrationAdminService manages machine clients that may call the internal
         gRPC API and subscribe to outbox events.
    - name: MeService
      description: MeService owns the authenticated user's self-service surface.
    - name: OIDCAdminService
      description: OIDCAdminService manages OAuth2/OIDC clients for the V2 provider.
    - name: OrganizationService
      description: |-
        OrganizationService owns organization, membership and department management.
         Organization roles (owner/admin/member) are separate from platform IAM roles.
    - name: SettingsService
      description: |-
        SettingsService owns non-secret authentication policy. Secret material is
         only accepted on write and never returned by this API.
