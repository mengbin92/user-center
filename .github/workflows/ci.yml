name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/...

  # MySQL-backed behaviour (versioned migrations, collation-sensitive OIDC repo
  # tests) is invisible to the SQLite suite above, so it gets its own job.
  mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: usercenter_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      USER_CENTER_MYSQL_TEST_DSN: "root:root@tcp(127.0.0.1:3306)/usercenter_test?parseTime=true&loc=UTC&charset=utf8mb4"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      # Migrations run first and twice (idempotency); the repository tests then
      # reuse the same database, so the two commands must stay sequential.
      # -run MySQL keeps the job fast: a new MySQL-only test must have "MySQL"
      # in its name, otherwise it is silently skipped here.
      - name: Verify migrations and MySQL repositories
        run: |
          go test -count=1 -run MySQL ./cmd/migrate/
          go test -count=1 -run MySQL ./internal/data/
          go test -count=1 -run MySQL ./internal/server/
      - name: Dump MySQL logs on failure
        if: failure()
        run: docker logs "${{ job.services.mysql.id }}" --tail 100

  # Hand-edited *.pb.go / wire_gen.go is a recurring review finding. Regenerate
  # in CI and fail on any diff instead of relying on reviewers to notice.
  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      # The official setup action still declares a Node 20 runtime, which
      # GitHub now force-runs on Node 24 and reports as a deprecation on every
      # run. Download the pinned CLI instead and verify the asset digest.
      - name: Install buf
        run: |
          mkdir -p "$RUNNER_TEMP/buf-bin"
          curl -fsSL -o "$RUNNER_TEMP/buf-bin/buf" \
            "https://github.com/bufbuild/buf/releases/download/v1.72.0/buf-Linux-x86_64"
          echo "8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af  $RUNNER_TEMP/buf-bin/buf" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/buf-bin/buf"
          echo "$RUNNER_TEMP/buf-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/buf-bin/buf" --version
      # Versions are pinned to the ones that produced the committed files:
      # a plugin bump rewrites the header comment and turns this job red.
      - name: Install protoc plugins and wire
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          go install github.com/go-kratos/kratos/cmd/protoc-gen-go-http/v3@v3.0.0-20260626125723-668db92c2c00
          go install github.com/google/gnostic/cmd/protoc-gen-openapi@v0.7.1
          go install github.com/google/wire/cmd/wire@v0.7.0
      - run: ./scripts/gen-check.sh

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: user-center:ci
      - name: Smoke image
        run: |
          trap 'docker logs uc-ci --tail 20; docker rm -f uc-ci' EXIT
          docker run -d --name uc-ci -e DB_DRIVER=sqlite -e DB_DSN='file:/tmp/uc.db?_fk=1' -e HTTP_ADDR=:8080 -e GRPC_ADDR=:9090 -p 18080:8080 user-center:ci sh -c "/app/migrate -config /app/configs/config.dev.yaml && /app/user-center -config /app/configs/config.dev.yaml"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/healthz && break || sleep 2; done
          curl -fsS http://127.0.0.1:18080/healthz
          # Readiness answers a different question than liveness, and it is what
          # the image's built-in HEALTHCHECK now uses. Assert both: a green
          # healthz over a 503 readyz is exactly the "container healthy, database
          # gone" state S13 was about.
          curl -fsS http://127.0.0.1:18080/readyz
          curl -fsS -I http://127.0.0.1:18080/login
