name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/...

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: user-center:ci
      - name: Smoke image
        run: |
          trap 'docker logs uc-ci --tail 20; docker rm -f uc-ci' EXIT
          docker run -d --name uc-ci -e DB_DRIVER=sqlite -e DB_DSN='file:/tmp/uc.db?_fk=1' -e HTTP_ADDR=:8080 -e GRPC_ADDR=:9090 -p 18080:8080 user-center:ci sh -c "/app/migrate -config /app/configs/config.dev.yaml && /app/user-center -config /app/configs/config.dev.yaml"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/healthz && break || sleep 2; done
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS -I http://127.0.0.1:18080/login
