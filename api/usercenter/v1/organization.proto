syntax = "proto3";

package api.usercenter.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "api/usercenter/v1/common.proto";
import "api/usercenter/v1/iam.proto";

option go_package = "github.com/mengbin92/user-center/api/usercenter/v1;usercv1";

// OrganizationService owns organization, membership and department management.
// Organization roles (owner/admin/member) are separate from platform IAM roles.
service OrganizationService {
  rpc ListMyOrganizations(ListMyOrganizationsRequest) returns (OrganizationsReply) {
    option (google.api.http) = {get: "/api/v1/orgs"};
  }
  rpc CreateOrganization(CreateOrganizationRequest) returns (Organization) {
    option (google.api.http) = {post: "/api/v1/orgs" body: "*"};
  }
  rpc GetOrganization(GetOrganizationRequest) returns (Organization) {
    option (google.api.http) = {get: "/api/v1/orgs/{id}"};
  }
  rpc UpdateOrganization(UpdateOrganizationRequest) returns (Organization) {
    option (google.api.http) = {patch: "/api/v1/orgs/{id}" body: "*"};
  }
  rpc ArchiveOrganization(ArchiveOrganizationRequest) returns (Organization) {
    option (google.api.http) = {post: "/api/v1/orgs/{id}:archive" body: "*"};
  }
  rpc ListOrganizationMembers(ListOrganizationMembersRequest) returns (OrganizationMembersReply) {
    option (google.api.http) = {get: "/api/v1/orgs/{id}/members"};
  }
  rpc AddOrganizationMember(AddOrganizationMemberRequest) returns (OrganizationMember) {
    option (google.api.http) = {post: "/api/v1/orgs/{id}/members" body: "*"};
  }
  rpc UpdateOrganizationMember(UpdateOrganizationMemberRequest) returns (OrganizationMember) {
    option (google.api.http) = {patch: "/api/v1/orgs/{id}/members/{user_id}" body: "*"};
  }
  rpc RemoveOrganizationMember(RemoveOrganizationMemberRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/orgs/{id}/members/{user_id}"};
  }
  rpc LeaveOrganization(LeaveOrganizationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {post: "/api/v1/orgs/{id}/members:leave" body: "*"};
  }
  rpc ListDepartments(ListDepartmentsRequest) returns (DepartmentsReply) {
    option (google.api.http) = {get: "/api/v1/orgs/{id}/departments"};
  }
  rpc CreateDepartment(CreateDepartmentRequest) returns (Department) {
    option (google.api.http) = {post: "/api/v1/orgs/{id}/departments" body: "*"};
  }
  rpc UpdateDepartment(UpdateDepartmentRequest) returns (Department) {
    option (google.api.http) = {patch: "/api/v1/orgs/{id}/departments/{department_id}" body: "*"};
  }
  rpc ArchiveDepartment(ArchiveDepartmentRequest) returns (Department) {
    option (google.api.http) = {post: "/api/v1/orgs/{id}/departments/{department_id}:archive" body: "*"};
  }

  // Organization-scoped IAM (V2.3). Every request is evaluated in the
  // organization:{id} context; identifiers of another tenant are not found.
  rpc ListOrgRoles(GetOrganizationRequest) returns (OrgRolesReply) {
    option (google.api.http) = {get: "/api/v1/orgs/{id}/iam/roles"};
  }
  rpc ListOrgPermissions(GetOrganizationRequest) returns (OrgPermissionsReply) {
    option (google.api.http) = {get: "/api/v1/orgs/{id}/iam/permissions"};
  }
  rpc CreateOrgRole(CreateOrgRoleRequest) returns (OrgRole) {
    option (google.api.http) = {post: "/api/v1/orgs/{id}/iam/roles" body: "*"};
  }
  rpc UpdateOrgRole(UpdateOrgRoleRequest) returns (OrgRole) {
    option (google.api.http) = {patch: "/api/v1/orgs/{id}/iam/roles/{role_id}" body: "*"};
  }
  rpc PutOrgRolePermissions(PutOrgRolePermissionsRequest) returns (OrgRole) {
    option (google.api.http) = {put: "/api/v1/orgs/{id}/iam/roles/{role_id}/permissions" body: "*"};
  }
  rpc ArchiveOrgRole(ArchiveOrgRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {post: "/api/v1/orgs/{id}/iam/roles/{role_id}:archive" body: "*"};
  }
  rpc ListOrgAssignments(GetOrganizationRequest) returns (OrgAssignmentsReply) {
    option (google.api.http) = {get: "/api/v1/orgs/{id}/iam/assignments"};
  }
  rpc CreateOrgAssignment(CreateOrgAssignmentRequest) returns (OrgAssignment) {
    option (google.api.http) = {post: "/api/v1/orgs/{id}/iam/assignments" body: "*"};
  }
  rpc RevokeOrgAssignment(RevokeOrgAssignmentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/orgs/{id}/iam/assignments/{assignment_id}"};
  }
  // Organization-scoped segregation of duties. Constraints defined here apply
  // only inside this tenant and can never relax platform policy.
  rpc ListOrgConstraints(GetOrganizationRequest) returns (OrgConstraintsReply) {
    option (google.api.http) = {get: "/api/v1/orgs/{id}/iam/constraints"};
  }
  rpc CreateOrgConstraint(CreateOrgConstraintRequest) returns (OrgConstraint) {
    option (google.api.http) = {post: "/api/v1/orgs/{id}/iam/constraints" body: "*"};
  }
  rpc UpdateOrgConstraint(UpdateOrgConstraintRequest) returns (OrgConstraint) {
    option (google.api.http) = {patch: "/api/v1/orgs/{id}/iam/constraints/{constraint_id}" body: "*"};
  }
  rpc DeleteOrgConstraint(DeleteOrgConstraintRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/orgs/{id}/iam/constraints/{constraint_id}"};
  }
  rpc ListOrgAudits(ListOrgAuditsRequest) returns (OrgAuditsReply) {
    option (google.api.http) = {get: "/api/v1/orgs/{id}/audits"};
  }
  rpc ExportOrgAudits(ExportOrgAuditsRequest) returns (ExportJob) {
    option (google.api.http) = {post: "/api/v1/orgs/{id}/audits:export" body: "*"};
  }
  rpc ExplainOrgAuthorization(ExplainOrgAuthorizationRequest) returns (ExplainOrgAuthorizationReply) {
    option (google.api.http) = {get: "/api/v1/orgs/{id}/iam/authorization:explain"};
  }
  rpc CreateOrganizationInvitation(CreateOrganizationInvitationRequest) returns (OrganizationInvitation) {
    option (google.api.http) = {post: "/api/v1/orgs/{id}/invitations" body: "*"};
  }
  rpc ListOrganizationInvitations(ListOrganizationInvitationsRequest) returns (OrganizationInvitationsReply) {
    option (google.api.http) = {get: "/api/v1/orgs/{id}/invitations"};
  }
  rpc RevokeOrganizationInvitation(RevokeOrganizationInvitationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/orgs/{id}/invitations/{invitation_id}"};
  }
  rpc AcceptOrganizationInvitation(AcceptOrganizationInvitationRequest) returns (OrganizationMember) {
    option (google.api.http) = {post: "/api/v1/orgs/invitations:accept" body: "*"};
  }

  // Platform administration; requires root/admin platform role.
  rpc AdminListOrganizations(AdminListOrganizationsRequest) returns (OrganizationsReply) {
    option (google.api.http) = {get: "/api/v1/admin/organizations"};
  }
  rpc AdminArchiveOrganization(AdminArchiveOrganizationRequest) returns (Organization) {
    option (google.api.http) = {post: "/api/v1/admin/organizations/{id}:archive" body: "*"};
  }
}

message Organization {
  string id = 1;
  string code = 2;
  string name = 3;
  // active | archived
  string status = 4;
  // my role in this organization: owner | admin | member | platform
  string role = 5;
  int64 member_count = 6;
  string revision = 7;
  string created_at = 8;
  string updated_at = 9;
}

message OrganizationMember {
  string id = 1;
  string organization_id = 2;
  string user_id = 3;
  string username = 4;
  string display_name = 5;
  string email = 6;
  // owner | admin | member
  string role = 7;
  string department_id = 8;
  string status = 9;
  string revision = 10;
  string joined_at = 11;
}

message Department {
  string id = 1;
  string organization_id = 2;
  string parent_id = 3;
  string code = 4;
  string name = 5;
  string status = 6;
  string revision = 7;
}

message ListMyOrganizationsRequest {}

message OrganizationsReply {
  repeated Organization items = 1;
}

message CreateOrganizationRequest {
  string code = 1;
  string name = 2;
}

message GetOrganizationRequest {
  string id = 1;
}

message UpdateOrganizationRequest {
  string id = 1;
  string name = 2;
  string expected_revision = 3;
  string reason = 4;
}

message ArchiveOrganizationRequest {
  string id = 1;
  string expected_revision = 2;
  string reason = 3;
}

message ListOrganizationMembersRequest {
  string id = 1;
}

message OrganizationMembersReply {
  repeated OrganizationMember items = 1;
}

message AddOrganizationMemberRequest {
  string id = 1;
  // username or email
  string identifier = 2;
  // owner | admin | member
  string role = 3;
  string department_id = 4;
  string reason = 5;
}

message UpdateOrganizationMemberRequest {
  string id = 1;
  string user_id = 2;
  string role = 3;
  string department_id = 4;
  string expected_revision = 5;
  string reason = 6;
}

message RemoveOrganizationMemberRequest {
  string id = 1;
  string user_id = 2;
  string expected_revision = 3;
  string reason = 4;
}

message LeaveOrganizationRequest {
  string id = 1;
}

message ListDepartmentsRequest {
  string id = 1;
}

message DepartmentsReply {
  repeated Department items = 1;
}

message CreateDepartmentRequest {
  string id = 1;
  string parent_id = 2;
  string code = 3;
  string name = 4;
}

message UpdateDepartmentRequest {
  string id = 1;
  string department_id = 2;
  string parent_id = 3;
  string code = 4;
  string name = 5;
  string expected_revision = 6;
  string reason = 7;
}

message ArchiveDepartmentRequest {
  string id = 1;
  string department_id = 2;
  string expected_revision = 3;
  string reason = 4;
}

message AdminListOrganizationsRequest {
  string status = 1;
}

message AdminArchiveOrganizationRequest {
  string id = 1;
  string expected_revision = 2;
  string reason = 3;
}

message OrgRole {
  string id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  bool builtin = 5;
  // active | archived
  string status = 6;
  string revision = 7;
  repeated Grant grants = 8;
}

message OrgRolesReply {
  repeated OrgRole items = 1;
}

message OrgPermissionsReply {
  repeated Permission items = 1;
}

message CreateOrgRoleRequest {
  string id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  repeated Grant grants = 5;
  string reason = 6;
}

message UpdateOrgRoleRequest {
  string id = 1;
  string role_id = 2;
  string name = 3;
  string description = 4;
  string expected_revision = 5;
  string reason = 6;
}

message PutOrgRolePermissionsRequest {
  string id = 1;
  string role_id = 2;
  repeated Grant grants = 3;
  string expected_revision = 4;
  string reason = 5;
}

message ArchiveOrgRoleRequest {
  string id = 1;
  string role_id = 2;
  string expected_revision = 3;
  string reason = 4;
}

message OrgAssignment {
  string id = 1;
  string user_id = 2;
  string username = 3;
  string display_name = 4;
  string role_id = 5;
  string role_code = 6;
  string role_name = 7;
  Scope boundary = 8;
  // active | revoked
  string status = 9;
  string revision = 10;
  string origin = 11;
  string expires_at = 12;
  string created_at = 13;
}

message OrgAssignmentsReply {
  repeated OrgAssignment items = 1;
}

message CreateOrgAssignmentRequest {
  string id = 1;
  string user_id = 2;
  string role_id = 3;
  string expires_at = 4;
  string reason = 5;
}

message RevokeOrgAssignmentRequest {
  string id = 1;
  string assignment_id = 2;
  string expected_revision = 3;
  string reason = 4;
}

message OrgAuditEvent {
  string event_id = 1;
  string actor_user_id = 2;
  string action = 3;
  string target = 4;
  string result = 5;
  string reason = 6;
  string occurred_at = 7;
}

message ListOrgAuditsRequest {
  string id = 1;
  string action = 2;
  string from = 3;
  string to = 4;
  int32 offset = 5;
  int32 page_size = 6;
}

message OrgAuditsReply {
  repeated OrgAuditEvent items = 1;
  int64 total = 2;
}

message ExportOrgAuditsRequest {
  string id = 1;
  string action = 2;
  string from = 3;
  string to = 4;
  repeated string fields = 5;
  string reason = 6;
}

message ExplainOrgAuthorizationRequest {
  string id = 1;
  string user_id = 2;
  string operation = 3;
}

message ExplainOrgAuthorizationReply {
  bool allowed = 1;
  string reason = 2;
  repeated GrantSource sources = 3;
  // Scope boundary, expiry and missing facts derived from the same decision.
  string context = 4;
  string scope = 5;
  string valid_until = 6;
  repeated string missing = 7;
  string policy_revision = 8;
  string user_revision = 9;
}

message OrganizationInvitation {
  string id = 1;
  string organization_id = 2;
  string email = 3;
  // owner | admin | member
  string role = 4;
  string department_id = 5;
  // pending | accepted | revoked | expired
  string status = 6;
  string invited_by = 7;
  string expires_at = 8;
  string accepted_at = 9;
  string created_at = 10;
  string revision = 11;
}

message OrganizationInvitationsReply {
  repeated OrganizationInvitation items = 1;
}

message CreateOrganizationInvitationRequest {
  string id = 1;
  string email = 2;
  string role = 3;
  string department_id = 4;
  string reason = 5;
}

message ListOrganizationInvitationsRequest {
  string id = 1;
  string status = 2;
}

message RevokeOrganizationInvitationRequest {
  string id = 1;
  string invitation_id = 2;
  string expected_revision = 3;
  string reason = 4;
}

message AcceptOrganizationInvitationRequest {
  // Raw invitation token from the e-mail; never stored in plaintext.
  string token = 1;
}

message OrgConstraint {
  string id = 1;
  // mutual_exclusion | max_roles
  string kind = 2;
  string name = 3;
  repeated string role_ids = 4;
  int64 max_count = 5;
  bool enabled = 6;
  string revision = 7;
  // How many existing assignments this constraint currently rejects. Non-zero
  // after a tightening edit means members already lost access, not that they
  // will lose it later.
  int64 violating_assignments = 8;
}

message OrgConstraintsReply {
  repeated OrgConstraint items = 1;
}

message CreateOrgConstraintRequest {
  string id = 1;
  string kind = 2;
  string name = 3;
  repeated string role_ids = 4;
  int64 max_count = 5;
  bool enabled = 6;
  string reason = 7;
  string expected_policy_revision = 8;
  // Required when the new constraint would invalidate existing assignments:
  // the caller must acknowledge that those members lose access immediately.
  bool acknowledge_violations = 9;
}

message UpdateOrgConstraintRequest {
  string id = 1;
  string constraint_id = 2;
  string name = 3;
  repeated string role_ids = 4;
  int64 max_count = 5;
  bool enabled = 6;
  string expected_revision = 7;
  string reason = 8;
  string expected_policy_revision = 9;
  bool acknowledge_violations = 10;
}

message DeleteOrgConstraintRequest {
  string id = 1;
  string constraint_id = 2;
  string expected_revision = 3;
  string reason = 4;
  string expected_policy_revision = 5;
}
