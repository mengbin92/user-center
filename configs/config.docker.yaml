# OAuth (GitHub / Google) credentials are NOT read from this file. They come
# from the environment:
#   OAUTH_GITHUB_CLIENT_ID / OAUTH_GITHUB_CLIENT_SECRET
#   OAUTH_GOOGLE_CLIENT_ID / OAUTH_GOOGLE_CLIENT_SECRET
# A provider is enabled only when both values for it are non-empty. Secrets
# never belong in a checked-in config or a compose env file in production;
# inject them from the secret manager.
#
# Callback URL must be HTTPS and must match PUBLIC_BASE_URL's host:
#   https://<public-host>/api/v1/auth/providers/{provider}/callback
# localhost/http callbacks are refused by the real providers and must not be
# used for acceptance. S14 (real-provider sandbox acceptance) is still N/A
# until decision D4 supplies credentials and a public HTTPS domain; see
# docs/roadmap-v2.5.md W6 and docs/security.md section 4 item 1.
server:
  http:
    addr: ":8080"
    timeout_seconds: 30
    public_base_url: "http://localhost:8080"
  grpc:
    addr: ":9090"
    timeout_seconds: 30

data:
  database:
    driver: mysql
    source: "usercenter:change-me@tcp(mysql:3306)/usercenter?parseTime=true&loc=UTC&charset=utf8mb4"
    max_open_conns: 20
    max_idle_conns: 10
  redis:
    addr: "redis:6379"
    password: ""
    db: 0

security:
  cookie_secure: true
  session_ttl_minutes: 720
  idle_timeout_minutes: 60
  step_up_ttl_minutes: 5
  trust_proxy_headers: true

mail:
  driver: console
  from: "no-reply@user-center.local"
