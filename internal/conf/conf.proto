syntax = "proto3";

package usercenter.conf;

option go_package = "github.com/mengbin92/user-center/internal/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Security security = 3;
  Mail mail = 4;
}

message Server {
  HTTP http = 1;
  GRPC grpc = 2;
  Metrics metrics = 3;
  RateLimit rate_limit = 4;
}

// RateLimit bounds authenticated write traffic. It is configuration, not a
// per-tenant setting: the right ceiling depends on how many instances are
// behind the load balancer, which settings cannot know.
message RateLimit {
  // false disables this middleware entirely. The authentication endpoints keep
  // their own limits either way, so they can never be bypassed from here.
  bool enabled = 1;
  // Requests per minute per subject for ordinary write endpoints.
  int32 write_per_minute = 2;
  // Stricter budget for exports, batch assignment and invitations, which are
  // the endpoints that can move bulk data in one call.
  int32 heavy_per_minute = 3;
}

message HTTP {
  string addr = 1;
  int32 timeout_seconds = 2;
  string public_base_url = 3;
}

message GRPC {
  string addr = 1;
  int32 timeout_seconds = 2;
}

// Metrics is a separate listener on purpose: /metrics must never be reachable
// through the public API listener or require a session.
message Metrics {
  // Empty keeps the default 127.0.0.1:9091 so a scrape can only come from the
  // same host unless it is widened explicitly. "off" disables the listener.
  string addr = 1;
  int32 refresh_seconds = 2;
}

message Data {
  Database database = 1;
  Redis redis = 2;
  // Per-organization schema isolation. Disabled by default: turning it on is
  // a deployment decision that requires running cmd/tenant-schema first.
  Tenancy tenancy = 3;
}

// Tenancy routes tenant-owned data to a dedicated MySQL schema (which in MySQL
// is a database) per organization, with its own connection pool. The platform
// schema keeps the shared identity and cross-tenant governance tables.
message Tenancy {
  bool schema_isolation = 1;
  // Default "usercenter_org_"; the organization id is appended verbatim.
  string schema_prefix = 2;
  int32 max_open_conns = 3;
  int32 max_idle_conns = 4;
}

message Database {
  // mysql | sqlite
  string driver = 1;
  string source = 2;
  int32 max_open_conns = 3;
  int32 max_idle_conns = 4;
}

message Redis {
  string addr = 1;
  string password = 2;
  int32 db = 3;
}

message Security {
  string session_secret = 1;
  string csrf_secret = 2;
  string mfa_encryption_key = 3;
  bool cookie_secure = 4;
  string cookie_domain = 5;
  int32 session_ttl_minutes = 6;
  int32 idle_timeout_minutes = 7;
  int32 step_up_ttl_minutes = 8;
  bool trust_proxy_headers = 9;
}

message Mail {
  // console | smtp
  string driver = 1;
  string from = 2;
  SMTP smtp = 3;
}

message SMTP {
  string host = 1;
  int32 port = 2;
  string username = 3;
  string password = 4;
}
