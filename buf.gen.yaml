version: v2
plugins:
  - local: protoc-gen-go
    out: .
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: .
    opt: paths=source_relative
  - local: protoc-gen-go-http
    out: .
    opt: paths=source_relative
  - local: protoc-gen-openapi
    out: .
    strategy: all
    opt:
      - fq_schema_naming=true
      - default_response=false
      - naming=proto
